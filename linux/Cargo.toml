[package]
name = "whistt"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.23.1"
clap = { version = "4.6.6", features = ["derive"] }
futures-util = "0.3.34"
libc = "0.2.189"
# Direct dependency only to enable exactly one rustls crypto provider. Without a
# provider feature rustls panics at handshake time instead of failing cleanly.
rustls = { version = "0.23.44", default-features = false, features = ["ring"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "io-util", "process", "sync", "time", "signal"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
