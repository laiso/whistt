name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag (e.g. v0.1.0). Skips auto-versioning.'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Decide if release is needed
        id: gate
        run: |
          LATEST_TAG=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1 || true)
          LATEST_TAG=${LATEST_TAG:-v0.0.0}
          echo "latest_tag=$LATEST_TAG" >> "$GITHUB_OUTPUT"

          # Manual dispatch always runs.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "reason=manual" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Skip if no source files changed since the previous release tag.
          if [ "$LATEST_TAG" = "v0.0.0" ]; then
            CHANGED="all (no previous tag)"
          else
            CHANGED=$(git diff --name-only "$LATEST_TAG"..HEAD)
          fi
          if echo "$CHANGED" | grep -qE '^(Whistt/Whistt/.*\.swift|Whistt/Whistt\.xcodeproj/.*|Package\.swift|Tools/.*\.swift|Tests/.*\.swift|Whistt/Whistt/Assets\.xcassets/.*)$' \
             || [ "$LATEST_TAG" = "v0.0.0" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "reason=docs-only" >> "$GITHUB_OUTPUT"
            echo "::notice::No source changes since $LATEST_TAG — skipping release."
          fi

      - name: Compute next version
        if: steps.gate.outputs.skip != 'true'
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          MSG=$(git log -1 --pretty=%B HEAD)
          NEW=$(.github/scripts/release-version.sh "${{ steps.gate.outputs.latest_tag }}" "$MSG")
          echo "tag=$NEW" >> "$GITHUB_OUTPUT"
          echo "::notice::Bumping ${{ steps.gate.outputs.latest_tag }} -> $NEW"

      - name: Generate release summary with Copilot
        if: steps.gate.outputs.skip != 'true'
        continue-on-error: true
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_PAT }}
          PREVIOUS_TAG: ${{ steps.gate.outputs.latest_tag }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          if [ -z "$COPILOT_GITHUB_TOKEN" ]; then
            echo "::notice::COPILOT_PAT is not configured; using commit-message release notes."
            exit 0
          fi

          npm install --global @github/copilot
          copilot -s --no-ask-user \
            --allow-tool='shell(git log:*)' \
            --allow-tool='shell(git diff:*)' \
            -p "Create a concise, user-facing release summary in English for ${RELEASE_TAG}. Inspect the changes from ${PREVIOUS_TAG} to HEAD using only git log and git diff. If ${PREVIOUS_TAG} is v0.0.0, inspect all history instead. Focus on behavior users will notice, group changes under useful Markdown headings, and omit implementation trivia, commit hashes, contributor lists, installation instructions, and a top-level title. Return only the Markdown release summary. Do not modify any files." \
            > .release-summary.md

          test -s .release-summary.md

      - name: Prepare release body
        if: steps.gate.outputs.skip != 'true'
        run: |
          .github/scripts/generate-release-body.sh \
            "${{ steps.gate.outputs.latest_tag }}" \
            "Whistt-${{ steps.version.outputs.tag }}.zip" \
            "$GITHUB_REPOSITORY" \
            .release-summary.md \
            .release-body.md

      - uses: maxim-lobanov/setup-xcode@60606e260d2fc5762a71e64e74b2174e8ea3c8bd # v1.6.0
        if: steps.gate.outputs.skip != 'true'
        with:
          xcode-version: latest-stable

      - name: Build Release
        if: steps.gate.outputs.skip != 'true'
        run: |
          cd Whistt
          xcodebuild \
            -project Whistt.xcodeproj \
            -scheme Whistt \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="-" \
            DEVELOPMENT_TEAM="" \
            build

      - name: Package .app into zip
        if: steps.gate.outputs.skip != 'true'
        id: package
        run: |
          VERSION="${{ steps.version.outputs.tag }}"
          ARTIFACT="Whistt-${VERSION}.zip"
          cd Whistt/build/Build/Products/Release
          ditto -c -k --sequesterRsrc --keepParent Whistt.app "../../../../${ARTIFACT}"
          echo "path=Whistt/${ARTIFACT}" >> "$GITHUB_OUTPUT"
          echo "name=${ARTIFACT}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: steps.gate.outputs.skip != 'true'
        with:
          name: ${{ steps.package.outputs.name }}
          path: ${{ steps.package.outputs.path }}
          if-no-files-found: error

      - name: Create GitHub Release
        if: steps.gate.outputs.skip != 'true'
        uses: softprops/action-gh-release@62c96d0c4e8a889135c1f3a25910db8dbe0e85f7 # v2.3.4
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          files: ${{ steps.package.outputs.path }}
          body_path: .release-body.md
