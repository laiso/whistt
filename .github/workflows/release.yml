name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag for the release (e.g. v0.1.0)'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Resolve version tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Release
        run: |
          cd Whistt
          xcodebuild \
            -project Whistt.xcodeproj \
            -scheme Whistt \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="-" \
            DEVELOPMENT_TEAM="" \
            build

      - name: Package .app into zip
        id: package
        run: |
          VERSION="${{ steps.tag.outputs.value }}"
          ARTIFACT="Whistt-${VERSION}.zip"
          cd Whistt/build/Build/Products/Release
          # ditto preserves resource forks / extended attributes correctly for .app bundles.
          ditto -c -k --sequesterRsrc --keepParent Whistt.app "../../../../${ARTIFACT}"
          echo "path=Whistt/${ARTIFACT}" >> "$GITHUB_OUTPUT"
          echo "name=${ARTIFACT}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: ${{ steps.package.outputs.path }}
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.value }}
          files: ${{ steps.package.outputs.path }}
          generate_release_notes: true
          body: |
            ## Install

            Whistt is distributed **unsigned**. Follow these steps:

            1. Download `${{ steps.package.outputs.name }}` below and double-click to unzip.
            2. Drag `Whistt.app` to `/Applications/`.
            3. Remove the Gatekeeper quarantine attribute:
               ```bash
               xattr -dr com.apple.quarantine /Applications/Whistt.app
               ```
            4. Launch Whistt, paste your OpenAI API key, and grant Microphone + Accessibility permissions in System Settings.

            See the [README](https://github.com/${{ github.repository }}/blob/main/README.md) for full usage.
